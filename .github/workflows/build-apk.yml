
name: Build Math Alarm APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract project
        run: unzip -q MathAlarm-GitHub-Actions.zip -d MathAlarm

      - name: Build APK
        run: gradle -p MathAlarm :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MathAlarm-APK
          path: MathAlarm/app/build/outputs/apk/debug/app-
          debug.apk
